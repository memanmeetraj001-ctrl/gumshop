<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)" />
  <circle cx="1080" cy="80" r="160" fill="#10B981" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="300" r="120" fill="#3B82F6" opacity="0.10" filter="url(#glow)" />

  <!-- Grid Overlay lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(80, 75)">
    <rect width="70" height="70" rx="18" fill="url(#accent-grad)" />
    <!-- Bolt / Zap Icon -->
    <path d="M38 12 L20 38 L34 38 L30 58 L52 28 L38 28 Z" fill="#064E3B" stroke="#064E3B" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(170, 115)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">
      GumShop<tspan fill="#34D399">.online</tspan>
    </text>
    <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="0.5">
      SUPER STORE V2 • PURE SUPABASE MULTI-TENANT PLATFORM
    </text>
  </g>

  <!-- Tagline Paragraph -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="18" fill="#CBD5E1">
    Autonomous multi-store ecommerce engine powered by Next.js 16 (Turbopack) &amp; Pure Supabase.
  </text>
  <text x="80" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#64748B">
    Features 100% store-isolated catalogs, creator Stan Stores, 1-click cloner, and dynamic in-frame Gumroad checkout.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 280)">
    <!-- Pill 1 -->
    <rect width="180" height="38" rx="12" fill="url(#card-grad)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#34D399">
      ⚡ Next.js 16 App Router
    </text>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="195" height="38" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#E2E8F0">
        🗄️ Supabase PostgreSQL
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="190" height="38" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#E2E8F0">
        💳 Gumroad In-Frame
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(610, 0)">
      <rect width="170" height="38" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#E2E8F0">
        🛡️ 100% Store Isolation
      </text>
    </g>
  </g>
</svg>
