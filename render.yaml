services:
  - type: web
    name: gumshop-saas
    runtime: node
    plan: starter
    buildCommand: npm install --prefix frontend && npm install --prefix backend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gumshop.online
      - key: ADMIN_PASSWORD
        value: admin123
