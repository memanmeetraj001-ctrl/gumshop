services:
  # ─── Full-Stack SaaS Web Service (Frontend SPA + Express REST API) ───
  - type: web
    name: gumshop-saas
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev --prefix frontend && npm install --include=dev --prefix backend && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gumshop.online
      - key: ADMIN_PASSWORD
        value: admin123
      - key: GUMROAD_ACCOUNT
        value: manmeetraj6
