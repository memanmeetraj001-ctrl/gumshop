services:
  # ─── Full-Stack SaaS Web Service (Frontend SPA + Express REST API) ───
  - type: web
    name: gumshop-saas
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev --prefix frontend && npm install --include=dev --prefix backend && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gumshop.online
      - key: ADMIN_PASSWORD
        value: admin123
      - key: GUMROAD_ACCOUNT
        value: manmeetraj6
      - key: LEMONSQUEEZY_STORE_SLUG
        value: gumshop
      - key: LEMONSQUEEZY_STORE_ID
        value: "465378"
      - key: LEMONSQUEEZY_VARIANT_PRO_MONTHLY
        value: "2082941"
      - key: LEMONSQUEEZY_VARIANT_PRO_ANNUAL
        value: "2082945"
      - key: LEMONSQUEEZY_VARIANT_SCALE_MONTHLY
        value: "2082951"
      - key: LEMONSQUEEZY_VARIANT_SCALE_ANNUAL
        value: "2082952"
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
